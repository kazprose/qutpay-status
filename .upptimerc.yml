# Qut Pay status page — Upptime (https://upptime.js.org)
# Бұл файл GitHub-тағы `kazprose/qutpay-status` репосының түбірінде тұрады (infra/status/README.md).
# Мониторлар GitHub Actions-та 5 минут сайын жүреді, тарих репоға коммит болады — тәуелсіз, ашық.
owner: kazprose
repo: qutpay-status

sites:
  - name: API (api.qut.kz/health)
    url: https://api.qut.kz/health
    expectedStatusCodes: [200]
  - name: Сайт (qut.kz)
    url: https://qut.kz/
  - name: Кабинет (qut.kz/app/login)
    url: https://qut.kz/app/login/
  - name: Құжаттама (api.qut.kz/docs)
    url: https://api.qut.kz/docs
  - name: Төлем беті (qut.kz/pay)
    url: https://qut.kz/pay/health
    expectedStatusCodes: [200, 404]

status-website:
  # DNS: CNAME status.qut.kz → kazprose.github.io (hoster.kz, 2026-10-25)
  cname: status.qut.kz
  logoUrl: https://qut.kz/og.png
  name: Qut Pay — күйі
  introTitle: "Qut Pay қызметінің күйі"
  introMessage: "api.qut.kz, qut.kz және кабинеттің қолжетімділігі мен жауап уақыты. Тексеру 5 минут сайын, тарих ашық репода: github.com/kazprose/qutpay-status. Ақаулар мен жоспарлы жұмыстар осы жерде жарияланады."
  navbar:
    - title: Күйі
      href: /
    - title: Сайт
      href: https://qut.kz
    - title: Құжаттама
      href: https://api.qut.kz/docs/guide/start
    - title: GitHub
      href: https://github.com/kazprose/qutpay-status
  themeUrl: https://unpkg.com/@upptime/theme@latest/dist/main.css
  theme: light

